name: Descargar fotos de los artículos
on:
  workflow_dispatch:
  push:
    paths: [fotos-lista.txt]
permissions:
  contents: write
jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: |
          while read -r slug url; do
            [ -z "$url" ] && continue
            mkdir -p "fotos/$slug"
            name=$(basename "${url%%\?*}")
            [ -f "fotos/$slug/$name" ] || curl -sSfL "$url" -o "fotos/$slug/$name" || echo "fallo: $url"
          done < fotos-lista.txt
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fotos
          git diff --cached --quiet || (git commit -m "Fotos de los artículos" && git push)
